<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Shuffle Up and Play">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4a43" />
      <stop offset="1" stop-color="#0d2828" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dcae" />
      <stop offset="1" stop-color="#c39b5c" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0d1320" />
  <rect x="34" y="34" width="444" height="444" rx="86" fill="url(#felt)" />

  <g transform="translate(256 268)">
    <rect x="-150" y="-118" width="150" height="212" rx="20"
      fill="#101827" stroke="url(#gold)" stroke-width="9"
      transform="rotate(-20)" />
    <rect x="-14" y="-132" width="150" height="212" rx="20"
      fill="#16202f" stroke="url(#gold)" stroke-width="9"
